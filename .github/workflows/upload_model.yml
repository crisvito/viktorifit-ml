name: Upload models to W&B

on:
  workflow_dispatch:
  push:
    branches: [ "master" ] 
    # paths:
    #   - 'models/**'  

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Re-run CI checks before deployment
  # ─────────────────────────────────────────────────────────
  run-ci:
    name: ✅ CI Checks
    uses: ./.github/workflows/ci.yml

  # ─────────────────────────────────────────────────────────
  # JOB 2: Upload models as separate artifacts
  # ─────────────────────────────────────────────────────────
  upload:
    name: 📦 Upload Models
    runs-on: ubuntu-latest
    needs: run-ci  # Only upload if CI passes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Download Git LFS files (model files)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install wandb

      - name: Debug - List models folder
        run: |
          echo "📁 Root directory:"
          ls -la
          echo ""
          echo "📁 Models directory:"
          ls -lah models/ || echo "models/ not found"
          echo ""
          echo "📁 ONNX directory:"
          ls -lah models/onnx/ || echo "models/onnx/ not found"

      - name: Login to W&B
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          wandb login $WANDB_API_KEY

      - name: Upload models as separate artifacts
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: viktorifit-ml
          WANDB_ENTITY: vincentfernandes1708-binus-university   
        run: |
          python scripts/upload_all_model.py
      
      - name: Summary
        run: |
          echo "✅ Models uploaded successfully"
          echo "View at: https://wandb.ai/${{ env.WANDB_ENTITY }}/${{ env.WANDB_PROJECT }}/artifacts"