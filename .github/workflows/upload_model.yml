name: Upload models to W&B

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Re-run CI checks before deployment
  # ─────────────────────────────────────────────────────────
  run-ci:
    name: ✅ CI Checks
    uses: ./.github/workflows/ci.yml

  upload:
    runs-on: ubuntu-latest
    needs: run-ci  # Only upload if CI passes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug models folder
        run: |
          echo "Listing root folder:"
          ls -la
          echo "Listing models folder:"
          ls -la models || echo "models folder not found"

      - name: Login to W&B
        run: wandb login ${{ secrets.WANDB_API_KEY }}

      - name: Upload models
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: viktorifit-ml
          WANDB_ENTITY: vincentfernandes1708-binus-university   
        run: python scripts/upload_all_model.py
