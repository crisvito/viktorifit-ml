# ============================================================
# CD — Continuous Deployment
# ViktoriFit ML Repository
#
# On PR → main:   Deploy a Preview URL (for review)
# On push → main: Deploy to Production + smoke test + auto-tag
#
# REQUIRES GitHub Secrets:
#   VERCEL_TOKEN      → From Vercel dashboard → Account Tokens
#   VERCEL_ORG_ID     → From `cat .vercel/project.json` after `vercel link`
#   VERCEL_PROJECT_ID → From `cat .vercel/project.json` after `vercel link`
# ============================================================

name: CD — Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress deploy for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────
  # JOB 1: Re-run CI checks before any deployment
  # ─────────────────────────────────────────────────────────
  run-ci:
    name: ✅ CI Checks
    uses: ./.github/workflows/ci.yml


  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy Preview (triggered by PRs only)
  # Creates a unique preview URL for every PR
  # ─────────────────────────────────────────────────────────
  deploy-preview:
    name: 🔍 Deploy Preview
    runs-on: ubuntu-latest
    needs: run-ci
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: |
          vercel pull --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: |
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Preview to Vercel
        id: preview
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Preview URL: $URL"
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post Preview URL as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.preview.outputs.url }}";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                "## 🚀 ViktoriFit ML API — Preview Deployed!",
                "",
                `**Preview URL:** ${url}`,
                "",
                "### Available Endpoints",
                `- \`POST ${url}/api/predict/meal\``,
                `- \`POST ${url}/api/predict/workout\``,
                `- \`POST ${url}/api/predict/progress\``,
                `- \`GET  ${url}/api/health\``,
                "",
                "> ⚠️ This preview will be replaced when the PR is merged."
              ].join("\n")
            });


  # ─────────────────────────────────────────────────────────
  # JOB 3: Deploy Production (triggered by push to main only)
  # ─────────────────────────────────────────────────────────
  deploy-production:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: run-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url:  ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project for production
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "🚀 Production URL: $URL"
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🩺 Smoke Test — Health Check
        run: |
          echo "Waiting 15s for deployment to warm up..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            ${{ steps.deploy.outputs.url }}/api/health)
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check FAILED (expected 200, got $STATUS)"
            exit 1
          fi
          echo "✅ Health check PASSED"

      - name: 🏷️  Create Release Tag
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha  = context.sha.substring(0, 7);
            const date = new Date().toISOString().split("T")[0];
            const tag  = `ml-v${date}-${sha}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   `refs/tags/${tag}`,
              sha:   context.sha,
            });
            console.log(`✅ Release tagged: ${tag}`);