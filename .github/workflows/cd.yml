# ============================================================
# CD — Continuous Deployment to Railway
# ViktoriFit ML Repository
#
# On push → main: Run CI, then deploy to Railway
#
# REQUIRES GitHub Secret:
#   RAILWAY_TOKEN → From Railway dashboard → Account → Tokens
# ============================================================

name: CD — Deploy to Railway

on:
  push:
    branches: ["main", "master"]  # Deploy on push to main and master branch

jobs:

  # ─────────────────────────────────────────────────────────
  # JOB 1: Re-run CI checks before deployment
  # ─────────────────────────────────────────────────────────
  run-ci:
    name: ✅ CI Checks
    uses: ./.github/workflows/ci.yml


  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy to Railway Production
  # ─────────────────────────────────────────────────────────
  deploy-railway:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: run-ci  # Only deploy if CI passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Debug Railway environment (safe checks)
        run: |
          echo "RAILWAY_TOKEN set? $( [ -z "$RAILWAY_TOKEN" ] && echo "no" || echo "yes" )"
          echo "RAILWAY_PROJECT_ID set? $( [ -z "$RAILWAY_PROJECT_ID" ] && echo "no" || echo "yes" )"
          echo "RAILWAY_SERVICE_ID set? $( [ -z "$RAILWAY_SERVICE_ID" ] && echo "no" || echo "yes" )"
          echo "railway whoami (non-sensitive):"
          railway whoami || true
          echo "railway status (non-sensitive):"
          # try JSON first if supported, otherwise fall back to human output
          railway status --json 2>/dev/null || railway status || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

      - name: 🚀 Deploy to Railway Production
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "❌ Missing required Railway secrets."
            exit 1
          fi

          railway up \
            --service $RAILWAY_SERVICE_ID \
            --project $RAILWAY_PROJECT_ID \
            --environment production \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

      - name: ⏳ Wait for Deployment to Finish
        run: |
          echo "Waiting for Railway deployment to stabilize..."
          sleep 40
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Get deployment URL
        id: railway-url
        run: |
          set -e

          # Kita panggil domain secara spesifik untuk Service ID tersebut.
          # Jika 'railway domain' gagal, kita pakai fallback ke 'railway status'.
          echo "Fetching domain for service: $RAILWAY_SERVICE_ID"
          
          URL=$(railway domain --service $RAILWAY_SERVICE_ID --json | jq -r '.[0].domain // empty')

          if [ -z "$URL" ]; then
            echo "Domain not found in 'railway domain', trying fallback..."
            # Fallback: Mengambil domain pertama dari status project
            URL=$(railway status --json | jq -r --arg ID "$RAILWAY_SERVICE_ID" '.services[] | select(.id == $ID) | .domains[0] // empty')
          fi

          if [ -z "$URL" ]; then
            echo "❌ ERROR: Could not locate a domain for service ID: $RAILWAY_SERVICE_ID"
            railway status || true
            exit 1
          fi

          echo "url=https://$URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: https://$URL"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}


      - name: 🩺 Smoke Test — Health Check
        run: |
          echo "Waiting for deployment to warm up..."
          URL="${{ steps.railway-url.outputs.url }}"
          
          # Coba ping URL setiap 10 detik, maksimal 3 menit (18 kali)
          for i in {1..18}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Health check PASSED"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS. Retrying in 10s..."
            sleep 10
          done
          
          echo "❌ Health check FAILED after 3 minutes"
          exit 1

      - name: 🏷️ Create Release Tag
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha  = context.sha.substring(0, 7);
            const date = new Date().toISOString().split("T")[0];
            const tag  = `ml-v${date}-${sha}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   `refs/tags/${tag}`,
              sha:   context.sha,
            });
            console.log(`✅ Release tagged: ${tag}`);
          