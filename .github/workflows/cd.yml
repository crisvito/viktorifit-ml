# ============================================================
# CD — Continuous Deployment to Railway
# ViktoriFit ML Repository
#
# On push → main: Run CI, then deploy to Railway
#
# REQUIRES GitHub Secret:
#   RAILWAY_TOKEN → From Railway dashboard → Account → Tokens
# ============================================================

name: CD — Deploy to Railway

on:
  push:
    branches: [main]

jobs:

  # ─────────────────────────────────────────────────────────
  # JOB 1: Re-run CI checks before deployment
  # ─────────────────────────────────────────────────────────
  run-ci:
    name: ✅ CI Checks
    uses: ./.github/workflows/ci.yml


  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy to Railway Production
  # ─────────────────────────────────────────────────────────
  deploy-railway:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: run-ci  # Only deploy if CI passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service viktorifit-ml
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Get deployment URL
        id: railway-url
        run: |
          URL=$(railway status --service viktorifit-ml --json | jq -r '.services[0].domains[0]')
          echo "url=https://$URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: https://$URL"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: 🩺 Smoke Test — Health Check
        run: |
          echo "Waiting 20s for deployment to warm up..."
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ steps.railway-url.outputs.url }}/")
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check FAILED (expected 200, got $STATUS)"
            exit 1
          fi
          echo "✅ Health check PASSED"

      - name: 🏷️ Create Release Tag
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha  = context.sha.substring(0, 7);
            const date = new Date().toISOString().split("T")[0];
            const tag  = `ml-v${date}-${sha}`;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   `refs/tags/${tag}`,
              sha:   context.sha,
            });
            console.log(`✅ Release tagged: ${tag}`);